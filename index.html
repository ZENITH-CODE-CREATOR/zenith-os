const coachSentences=Array.from({length:100},(_,i)=>{const topics=['training','food','water','sleep','match','mindset','goal','recovery','speed','technique'];const topic=topics[i%topics.length];const map={training:'Focus on one clean training block and finish it strong.',food:'Choose a simple high-protein meal and log it honestly.',water:'Drink water now and check your total later today.',sleep:'Protect your sleep because recovery makes training work.',match:'Think about one match moment you can improve next time.',mindset:'Stay calm, choose one task, and execute it.',goal:'Make the goal smaller so you can complete it today.',recovery:'If your body feels heavy, lower intensity but keep discipline.',speed:'Short explosive actions with full rest will build speed.',technique:'Slow technical reps create clean match actions.'};return{topic,text:map[topic]+' #'+(i+1)}});

function Login({accounts,setAccounts,setCurrent}){const[mode,setMode]=useState('login'),[u,setU]=useState(''),[p,setP]=useState(''),[err,setErr]=useState('');function submit(e){e.preventDefault();const name=u.trim().toLowerCase();setErr('');if(!name||!p)return setErr('Fill username and password.');if(mode==='create'){if(accounts[name])return setErr('Username already exists.');setAccounts({...accounts,[name]:{password:p,created:new Date().toISOString()}});setCurrent(name);return}if(!accounts[name]||accounts[name].password!==p)return setErr('Wrong username or password.');setCurrent(name)}return <div className="min-h-screen flex items-center justify-center p-6"><Panel className="max-w-lg w-full"><div className="text-center"><div className="text-6xl">⚡</div><h1 className="title">ZENITH OS</h1><p className="muted text-zinc-400 font-bold my-4">Local accounts stay saved in this browser.</p></div><div className="flex bg-black/60 p-2 rounded-2xl mb-4"><button onClick={()=>setMode('login')} className={'flex-1 py-3 rounded-xl font-black '+(mode==='login'?'btn':'text-zinc-500')}>Login</button><button onClick={()=>setMode('create')} className={'flex-1 py-3 rounded-xl font-black '+(mode==='create'?'btn':'text-zinc-500')}>Create account</button></div><form onSubmit={submit} className="space-y-3"><Input placeholder="Username" value={u} onChange={e=>setU(e.target.value)}/><Input type="password" placeholder="Password" value={p} onChange={e=>setP(e.target.value)}/>{err&&<p className="text-red-400 bg-red-500/10 p-3 rounded-xl font-bold">{err}</p>}<button className="btn w-full">{mode==='create'?'Create account':'Login'}</button></form><p className="text-xs text-zinc-500 text-center mt-3">Accounts: {Object.keys(accounts).length}</p></Panel></div>}

function Main({user,accounts,setAccounts,setCurrent}){const[tab,setTab]=useState('dash'),[toast,setToast]=useState(null);const[lang,setLang]=useUserStore(user,'lang','en');const[theme,setTheme]=useUserStore(user,'theme','dark');const[photo,setPhoto]=useUserStore(user,'photo','');const[stats,setStats]=useUserStore(user,'stats',{xp:0,level:1,streak:0,lastActive:todayKey()});const[water,setWater]=useUserStore(user,'water',{date:todayKey(),ml:0});const[profile,setProfile]=useUserStore(user,'profile',{name:'Athlete',age:'',weight:'',height:'',position:'Forward',club:'',goal:'Become a pro footballer',strength:'',improve:''});const[recovery,setRecovery]=useUserStore(user,'recovery',{date:todayKey(),sleep:8,soreness:5,fitness:7});const[matches,setMatches]=useUserStore(user,'matches',[]);const[recipes,setRecipes]=useUserStore(user,'recipes',defaultRecipes);const[food,setFood]=useUserStore(user,'food',[]);const[habits,setHabits]=useUserStore(user,'habits',defaultHabits);const[schedule,setSchedule]=useUserStore(user,'schedule',defaultSchedule);const[goals,setGoals]=useUserStore(user,'goals',{day:'',week:'',month:'',year:''});const[pack,setPack]=useUserStore(user,'pack',[{id:uid(),label:'Boots',done:false},{id:uid(),label:'Bottle',done:false}]);const[workouts,setWorkouts]=useUserStore(user,'workouts',defaultWorkouts);const[skillLib,setSkillLib]=useUserStore(user,'skillLib',defaultSkills);const[quests,setQuests]=useUserStore(user,'quests',defaultQuests);const[notes,setNotes]=useUserStore(user,'notes',[]);const[chat,setChat]=useUserStore(user,'chat',[]);const[clock,setClock]=useState(new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}));useEffect(()=>{const id=setInterval(()=>setClock(new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})),60000);return()=>clearInterval(id)},[]);useEffect(()=>{const d=todayKey();if(stats.lastActive!==d){setStats(s=>({...s,lastActive:d,streak:(s.streak||0)+1}));setHabits(h=>(Array.isArray(h)?h:defaultHabits).map(x=>({...x,done:false})));setQuests(defaultQuests)}if(water.date!==d)setWater({date:d,ml:0});if(recovery.date!==d)setRecovery(r=>({...r,date:d}))},[]);const say=(msg,type='ok')=>{setToast({msg,type});setTimeout(()=>setToast(null),2100)};const xp=n=>setStats(s=>{const old=s||{xp:0,level:1};const nx=Number(old.xp||0)+n,l=Math.floor(nx/1000)+1;say(l>old.level?'LEVEL UP! Level '+l:'+'+n+' XP');return{...old,xp:nx,level:l}});const P={user,accounts,setAccounts,setCurrent,tab,setTab,lang,setLang,theme,setTheme,photo,setPhoto,stats,setStats,water,setWater,profile,setProfile,recovery,setRecovery,matches,setMatches,recipes,setRecipes,food,setFood,habits,setHabits,schedule,setSchedule,goals,setGoals,pack,setPack,workouts,setWorkouts,skillLib,setSkillLib,quests,setQuests,notes,setNotes,chat,setChat,clock,say,xp};const tabs=[['dash','🏠','home'],['schedule','📅','schedule'],['goals','🎯','goals'],['habits','✅','habits'],['training','🏋️','training'],['matches','🛡️','matches'],['food','🍎','food'],['recovery','💜','recovery'],['mindset','🧠','mindset'],['quests','🏆','quests'],['profile','👤','profile'],['coach','🤖','coach'],['stats','📊','stats'],['settings','⚙️','settings']];return <div className={theme==='light'?'light h-screen flex overflow-hidden':'h-screen flex overflow-hidden'}><Toast t={toast}/><aside className="hidden md:flex flex-col w-[285px] bg-[#03020A] p-6 border-r border-white/5 panel"><div className="flex gap-3 items-center mb-8"><span className="text-3xl">⚡</span><b className="text-2xl">ZENITH</b></div><nav className="flex-1 overflow-y-auto scroll pr-2 space-y-1">{tabs.map(x=><button key={x[0]} onClick={()=>setTab(x[0])} className={'w-full flex gap-3 px-4 py-3 rounded-2xl font-black '+(tab===x[0]?'tabactive':'text-zinc-500 hover:bg-white/5 hover:text-white')}><span>{x[1]}</span>{tr(lang,x[2])}</button>)}</nav><Panel className="mt-4"><p className="text-xs muted text-zinc-500 font-black">LEVEL {stats.level}</p><p className="font-black truncate">{profile.name}</p><div class function Dashboard({lang,profile,water,setWater,recovery,food,schedule,habits,goals,clock,setTab,xp}){const tasks=(schedule&&schedule[todayName()])||[],done=tasks.filter(t=>t.done).length,next=tasks.find(t=>!t.done),meals=(Array.isArray(food)?food:[]).filter(f=>f.date===todayKey()),kcal=meals.reduce((s,m)=>s+Number(m.cal||0),0),protein=meals.reduce((s,m)=>s+Number(m.protein||0),0),ready=Math.max(1,Math.min(100,(recovery.fitness||7)*10-(recovery.soreness||5)*3+(recovery.sleep>=8?10:0)));return <div className="space-y-6 max-w-7xl mx-auto"><div className="flex flex-col lg:flex-row lg:justify-between gap-4"><div><p className="text-indigo-400 font-black uppercase">ZENITH OS</p><h1 className="title">Ready, {profile.name||'Athlete'}.</h1></div><div className="grid grid-cols-2 sm:flex gap-3">{[['Time',clock,''],['Readiness',ready+'%',ready>75?'text-emerald-400':ready>50?'text-amber-400':'text-red-400'],['Water',water.ml+'ml','text-blue-400'],['Protein',protein+'g','text-emerald-400']].map(x=><Panel key={x[0]} className="px-4 py-3"><p className="muted text-zinc-500 text-xs font-black">{x[0]}</p><p className={'text-xl font-black '+x[2]}>{x[1]}</p></Panel>)}</div></div><div className="grid xl:grid-cols-3 gap-6"><Panel onClick={()=>setTab('schedule')} className="xl:col-span-2 cursor-pointer"><p className="text-indigo-400 text-xs font-black uppercase">Next task</p><h3 className="text-3xl md:text-5xl font-black my-4">{next?next.task:'Schedule complete'}</h3>{next&&<p className="text-indigo-300 font-black">⏰ {next.time}</p>}<div className="h-3 bg-black rounded-full mt-6"><div className="h-3 bg-indigo-500 rounded-full" style={{width:`${tasks.length?done/tasks.length*100:100}%`}}></div></div></Panel><div className="grid grid-cols-2 xl:grid-cols-1 gap-4"><Panel><p className="muted text-zinc-500 text-xs">Water</p><p className="text-4xl text-blue-400 font-black">{water.ml}</p><button onClick={()=>{setWater(w=>({...w,ml:(w.ml||0)+250}));xp(5)}} className="btn btn2 w-full mt-3">+250ML</b function Quests({quests,setQuests,water,recovery,matches,food,habits,notes,workouts,xp,say}){const qs=Array.isArray(quests)?quests:[],meals=(Array.isArray(food)?food:[]).filter(m=>m.date===todayKey());const check=q=>q.type==='water'?water.ml>=3000:q.type==='sleep'?recovery.sleep>=8:q.type==='match'?(matches||[]).some(m=>m.date===nlDate()):q.type==='protein'?meals.reduce((s,m)=>s+Number(m.protein||0),0)>=100:q.type==='habits'?(habits||[]).every(h=>h.done):q.type==='notes'?(notes||[]).length>0:q.type==='fitness'?recovery.fitness>=7:q.type==='food'?meals.length>=3:q.type==='workout'?(workouts||[]).some(w=>(w.ex||[]).some(o=>o.done)):false;return <div className="space-y-6"><Head icon="🏆" title="Quests"/><div className="grid md:grid-cols-2 xl:grid-cols-3 gap-5">{qs.map(q=><Panel key={q.id} className={q.done?'opacity-50':''}><h3 className="text-2xl font-black">{q.title}</h3><p className="muted text-zinc-400 my-3">{q.desc}</p><p className="text-amber-400 font-black mb-4">+{q.xp} XP</p>{q.done?<p className="text-emerald-400 font-black">Completed ✓</p>:<button onClick={()=>{if(check(q)){setQuests(qs.map(x=>x.id===q.id?{...x,done:true}:x));xp(q.xp);say('Quest completed')}else say('Not completed yet','error')}} className="btn amber w-full">Check quest</button>}</Panel>)}</div></div>}
function Profile({user,accounts,setAccounts,setCurrent,photo,setPhoto,profile,setProfile,stats,matches,say}){const[newPass,setNewPass]=useState('');const arr=Array.isArray(matches)?matches:[];const goals=arr.reduce((s,m)=>s+Number(m.goals||0),0),assists=arr.reduce((s,m)=>s+Number(m.assists||0),0);function upload(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>setPhoto(reader.result);reader.readAsDataURL(file)}return <div className="space-y-6 max-w-6xl mx-auto"><Head icon="👤" title="Profile"/><div className="grid lg:grid-cols-3 gap-6"><Panel className="lg:col-span-2"><div className="flex gap-4 items-center mb-4"><div className="w-24 h-24 rounded-3xl bg-black overflow-hidden flex items-center justify-center text-4xl">{photo?<img src={photo} className="w-full h-full object-cover"/>:'👤'}</div><Input type="file" accept="image/*" onChange={upload}/></div><div className="grid md:grid-cols-2 gap-3"><Input placeholder="Name" value={profile.name} onChange={e=>setProfile({...profile,name:e.target.value})}/><Input placeholder="Age" value={profile.age} onChange={e=>setProfile({...profile,age:e.target.value})}/><Input placeholder="Weight" value={profile.weight} onChange={e=>setProfile({...profile,weight:e.target.value})}/><Input placeholder="Height" value={profile.height} onChange={e=>setProfile({...profile,height:e.target.value})}/><Select value={profile.position} onChange={e=>setProfile({...profile,position:e.target.value})}><option>Forward</option><option>Midfielder</option><option>Defender</option><option>Goalkeeper</option></Select><Input placeholder="Club/team" value={profile.club} onChange={e=>setProfile({...profile,club:e.target.value})}/><Input placeholder="Strength" value={profile.strength} onChange={e=>setProfile({...profile,strength:e.target.value})}/><Input placeholder="Improve" value={profile.improve} onChange={e=>setProfile({...profile,improve:e.target.value})}/></div><Textarea className="mt-3 min-h-[100px]" value={profile.goal} onChange={e=>setProfile({...profile,goal:e.target.value})}/><button onClick={()=>say('Profile saved')} className="btn w-full mt-3">Save profile</button></Panel><div className="space-y-5"><Panel><h3 className="text-2xl font-black">Account</h3><p className="muted text-zinc-500">{user}</p><Input type="password" placeholder="New password" value={newPass} onChange={e=>setNewPass(e.target.value)} className="mt-3"/><button onClick={()=>{if(newPass){setAccounts({...accounts,[user]:{...(accounts[user]||{}),password:newPass}});setNewPass('');say('Password changed')}}} className="btn w-full mt-3">Change password</button><button onClick={()=>setCurrent(null)} className="btn danger w-full mt-3">Logout</button></Panel><Panel>{[['Level',stats.level],['XP',stats.xp],['Streak',stats.streak],['Goals',goals],['Assists',assists],['Matches',arr.length]].map(x=><div key={x[0]} className="flex justify-between bg-black rounded-xl p-3 mb-2"><span>{x[0]}</span><b>{x[1]}</b></div>)}</Panel></div></div></div>}
function Coach({profile,recovery,water,food,chat,setChat}){const[text,setText]=useState(''),end=useRef(null);useEffect(()=>{if(end.current){try{end.current.scrollIntoView({behavior:'smooth'})}catch(e){}}return undefined},[chat]);function send(e){e.preventDefault();const msg=text.trim().toLowerCase();if(!msg)return;let options=coachSentences.filter(r=>msg.includes(r.topic));if(options.length===0)options=coachSentences.filter(r=>['mindset','goal','training'].includes(r.topic));const pick=options[Math.floor(Math.random()*options.length)].text;const protein=(Array.isArray(food)?food:[]).filter(m=>m.date===todayKey()).reduce((s,m)=>s+Number(m.protein||0),0);const answer=`${profile.name||'Athlete'}: ${pick} Data: sleep ${recovery.sleep}h, fitness ${recovery.fitness}/10, water ${water.ml}ml, protein ${protein}g.`;setChat([...(Array.isArray(chat)?chat:[]),{id:uid(),role:'user',text},{id:uid(),role:'coach',text:answer}]);setText('')}const arr=Array.isArray(chat)?chat:[];return <div className="h-[75vh] md:h-[85vh] max-w-4xl mx-auto flex flex-col"><div className="flex justify-between mb-4"><Head icon="🤖" title="Coach"/><button onClick={()=>setChat([])} className="btn danger text-xs">Clear</button></div><Panel className="flex-1 overflow-y-auto scroll space-y-3">{arr.length===0&&<p className="muted text-zinc-500 text-center mt-20">Type something to your coach.</p>}{arr.map(m=><div key={m.id} className={'flex '+(m.role==='user'?'justify-end':'justify-start')}><div className={'max-w-[85%] p-4 rounded-2xl font-bold '+(m.role==='user'?'bg-indigo-600':'bg-black border border-white/10')}>{m.text}</div></div>)}<div ref={end}></div></Panel><form onSubmit={send} className="flex gap-3 mt-3"><Input value={text} onChange={e=>setText(e.target.value)} placeholder="Message..."/><button className="btn">Send</button></form></div>}
function Stats({accounts,stats,matches,food,workouts,habits,quests}){const safeObj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};const safeArr=v=>Array.isArray(v)?v:[];const acc=safeObj(accounts),st=safeObj(stats),ms=safeArr(matches),fd=safeArr(food),wo=safeArr(workouts),hb=safeArr(habits),qs=safeArr(quests);const leaderboard=Object.keys(acc).map(u=>{let val=0;try{const raw=localStorage.getItem('zenith_v11_'+u+'_stats');const parsed=raw?JSON.parse(raw):{};val=Number(parsed&&parsed.xp||0)}catch(e){val=0}return{u,xp:val}}).sort((a,b)=>b.xp-a.xp);const badges=[['First Login',true],['Match Logger',ms.length>0],['Nutrition Starter',fd.length>0],['Training Builder',wo.length>2],['Habit Hero',hb.filter(h=>h&&h.done).length>0],['Quest Hunter',qs.filter(q=>q&&q.done).length>0],['XP 1000+',Number(st.xp||0)>=1000]];return <div className="space-y-6 max-w-6xl mx-auto"><Head icon="📊" title="Stats"/><div className="grid md:grid-cols-2 gap-6"><Panel><h3 className="text-2xl font-black mb-4">Badges</h3>{badges.map((b,i)=><p key={i} className={b[1]?'text-emerald-400 font-black':'muted text-zinc-500'}>{b[1]?'🏅':'🔒'} {b[0]}</p>)}</Panel><Panel><h3 className="text-2xl font-black mb-4">Local XP leaderboard</h3>{leaderboard.length===0?<p className="muted text-zinc-500">No accounts yet.</p>:leaderboard.map((x,i)=><div key={x.u} className="flex justify-between bg-black p-3 rounded-xl mb-2"><span>{i+1}. {x.u}</span><b>{x.xp} XP</b></div>)}</Panel></div></div>}
function Settings({lang,setLang,theme,setTheme,say}){function notify(){if(!('Notification'in window)){say('Notifications not supported','error');return}Notification.requestPermission().then(p=>say(p==='granted'?'Notifications enabled':'Notifications blocked',p==='granted'?'ok':'error'))}return <div className="space-y-6 max-w-4xl mx-auto"><Head icon="⚙️" title="Settings"/><Panel><p className="mb-3 text-indigo-300 font-black">Language is here. Choose a language and it saves automatically.</p><label className="font-black">{tr(lang,'language')}</label><Select value={lang} onChange={e=>setLang(e.target.value)}>{Object.entries(LANGS).map(([k,v])=><option key={k} value={k}>{v}</option>)}</Select><label className="font-black block mt-5">{tr(lang,'theme')}</label><div className="flex gap-2 mt-2"><button onClick={()=>setTheme('dark')} className="btn">Dark</button><button onClick={()=>setTheme('light')} className="btn btn2">Light</button></div><button onClick={notify} className="btn green mt-5">Enable daily notifications</button><button onClick={()=>{Object.keys(localStorage).filter(k=>k.startsWith('zenith_')).forEach(k=>localStorage.removeItem(k));location.reload()}} className="btn danger mt-3 ml-0 md:ml-3">Reset app data</button></Panel></div>}
class ErrorBoundary extends React.Component{constructor(p){super(p);this.state={err:null}}static getDerivedStateFromError(e){return{err:e}}componentDidCatch(e){console.error(e)}render(){if(this.state.err){return <div style={{minHeight:'100vh',background:'#010204',color:'white',display:'flex',alignItems:'center',justifyContent:'center',padding:'24px',fontFamily:'Arial'}}><div style={{maxWidth:'760px',background:'#0a0a0f',border:'1px solid rgba(255,255,255,.12)',borderRadius:'28px',padding:'28px'}}><h1 style={{fontSize:'32px',fontWeight:900,marginBottom:'12px'}}>Zenith OS error</h1><p style={{color:'#fca5a5',fontWeight:700,marginBottom:'12px'}}>Er ging iets mis, maar je krijgt nu geen zwart scherm meer.</p><pre style={{whiteSpace:'pre-wrap',background:'#000',padding:'16px',borderRadius:'16px',color:'#ddd',maxHeight:'220px',overflow:'auto'}}>{String(this.state.err&&this.state.err.message||this.state.err)}</pre><button onClick={()=>{Object.keys(localStorage).filter(k=>k.startsWith('zenith_')).forEach(k=>localStorage.removeItem(k));location.reload()}} style={{marginTop:'16px',background:'#ef4444',color:'#fff',fontWeight:900,border:0,borderRadius:'16px',padding:'12px 18px'}}>Reset app data</button></div></div>}return this.props.children}}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
